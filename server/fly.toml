# Fly.io config for the ArchonX admin backend. Deploy from the repo root with:
#   fly deploy --config server/fly.toml --dockerfile server/Dockerfile --ha=false .
# "archonx-admin" is a placeholder app name; rename it if the name is taken (the URL follows the name).

app = "archonx-admin"
primary_region = "syd"

[build]

[env]
  TRUST_PROXY = "1"

[mounts]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 4324
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/healthz"
