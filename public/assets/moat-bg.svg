<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" fill="none">
  <!-- Advantage cover plate: concentric defensive rings around a guarded
       core — the moat — behind the MOAT cover. -->
  <defs>
    <pattern id="tgrid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <radialGradient id="tglow" cx="0.72" cy="0.46" r="0.55">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#tgrid)"/>
  <rect width="1600" height="900" fill="url(#tglow)"/>

  <!-- The core -->
  <g transform="rotate(45 1160 430)">
    <rect x="1136" y="406" width="48" height="48" stroke="#ffffff" stroke-opacity="0.45"/>
  </g>
  <circle cx="1160" cy="430" r="4" fill="#ffffff" fill-opacity="0.6"/>

  <!-- Defensive rings: alternating solid octagons and dashed circles -->
  <g stroke="#ffffff" stroke-opacity="0.30">
    <path d="M 1160 310 L 1245 345 L 1280 430 L 1245 515 L 1160 550 L 1075 515 L 1040 430 L 1075 345 Z"/>
  </g>
  <circle cx="1160" cy="430" r="190" stroke="#ffffff" stroke-opacity="0.20" stroke-dasharray="3 9"/>
  <g stroke="#ffffff" stroke-opacity="0.15">
    <path d="M 1160 160 L 1351 239 L 1430 430 L 1351 621 L 1160 700 L 969 621 L 890 430 L 969 239 Z"/>
  </g>
  <circle cx="1160" cy="430" r="360" stroke="#ffffff" stroke-opacity="0.09" stroke-dasharray="3 9"/>
  <g stroke="#ffffff" stroke-opacity="0.06">
    <path d="M 1160 -60 L 1506 84 L 1650 430 L 1506 776 L 1160 920 L 814 776 L 670 430 L 814 84 Z"/>
  </g>

  <!-- Gate ticks: the single crossing point through each ring -->
  <g stroke="#ffffff" stroke-opacity="0.4">
    <line x1="1160" y1="302" x2="1160" y2="318"/>
    <line x1="1160" y1="232" x2="1160" y2="248"/>
    <line x1="1160" y1="152" x2="1160" y2="168"/>
    <line x1="1160" y1="62" x2="1160" y2="78"/>
  </g>
  <line x1="1160" y1="70" x2="1160" y2="310" stroke="#ffffff" stroke-opacity="0.10" stroke-dasharray="2 8"/>

  <!-- Repelled contacts outside the outer ring -->
  <g fill="#ffffff" fill-opacity="0.4">
    <circle cx="560" cy="240" r="3"/>
    <circle cx="480" cy="620" r="3"/>
    <circle cx="700" cy="760" r="3"/>
  </g>
  <g stroke="#ffffff" stroke-opacity="0.14">
    <path d="M 560 240 l 90 60"/>
    <path d="M 480 620 l 100 -30"/>
    <path d="M 700 760 l 70 -70"/>
  </g>

  <!-- Crosshair markers -->
  <g stroke="#ffffff" stroke-opacity="0.26">
    <path d="M 260 170 h 18 M 269 161 v 18"/>
    <path d="M 180 750 h 18 M 189 741 v 18"/>
    <path d="M 1480 780 h 18 M 1489 771 v 18"/>
  </g>
</svg>
