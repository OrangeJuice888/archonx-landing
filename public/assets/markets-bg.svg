<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" fill="none">
  <!-- Markets cover plate: an eight-sector radar — one spoke per theatre of
       command — behind the MARKETS cover. -->
  <defs>
    <pattern id="mgrid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <radialGradient id="mglow" cx="0.74" cy="0.42" r="0.58">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#mgrid)"/>
  <rect width="1600" height="900" fill="url(#mglow)"/>

  <!-- Radar rings, centred right of the headline mass -->
  <g stroke="#ffffff">
    <circle cx="1180" cy="410" r="120" stroke-opacity="0.28"/>
    <circle cx="1180" cy="410" r="230" stroke-opacity="0.18"/>
    <circle cx="1180" cy="410" r="350" stroke-opacity="0.11"/>
    <circle cx="1180" cy="410" r="480" stroke-opacity="0.06"/>
  </g>

  <!-- Eight spokes: one per theatre -->
  <g stroke="#ffffff" stroke-opacity="0.16">
    <line x1="1180" y1="60" x2="1180" y2="760"/>
    <line x1="830" y1="410" x2="1530" y2="410"/>
    <line x1="933" y1="163" x2="1427" y2="657"/>
    <line x1="933" y1="657" x2="1427" y2="163"/>
  </g>

  <!-- One sector swept: dashed arc + contact plots -->
  <path d="M 1180 410 L 1427 163 A 350 350 0 0 1 1530 410 Z" stroke="#ffffff" stroke-opacity="0.22" fill="#ffffff" fill-opacity="0.025"/>
  <g stroke="#ffffff" stroke-opacity="0.34" stroke-dasharray="2 10">
    <path d="M 1180 410 m 290 0 a 290 290 0 0 0 -85 -205"/>
  </g>

  <!-- Contact plots across the theatres -->
  <g fill="#ffffff" fill-opacity="0.55">
    <circle cx="1332" cy="330" r="3.5"/>
    <circle cx="1420" cy="390" r="3"/>
    <circle cx="1258" cy="255" r="3"/>
    <circle cx="1055" cy="300" r="3"/>
    <circle cx="1100" cy="545" r="3"/>
    <circle cx="1305" cy="520" r="3"/>
    <circle cx="985" cy="455" r="3"/>
  </g>
  <circle cx="1332" cy="330" r="10" stroke="#ffffff" stroke-opacity="0.35"/>
  <circle cx="1180" cy="410" r="4" fill="#ffffff" fill-opacity="0.6"/>

  <!-- Bearing ticks on the second ring -->
  <g stroke="#ffffff" stroke-opacity="0.3">
    <line x1="1180" y1="174" x2="1180" y2="188"/>
    <line x1="1180" y1="174" x2="1180" y2="188" transform="rotate(45 1180 410)"/>
    <line x1="1180" y1="174" x2="1180" y2="188" transform="rotate(90 1180 410)"/>
    <line x1="1180" y1="174" x2="1180" y2="188" transform="rotate(135 1180 410)"/>
    <line x1="1180" y1="174" x2="1180" y2="188" transform="rotate(180 1180 410)"/>
    <line x1="1180" y1="174" x2="1180" y2="188" transform="rotate(225 1180 410)"/>
    <line x1="1180" y1="174" x2="1180" y2="188" transform="rotate(270 1180 410)"/>
    <line x1="1180" y1="174" x2="1180" y2="188" transform="rotate(315 1180 410)"/>
  </g>

  <!-- Coordinate readout rules, lower left -->
  <g stroke="#ffffff" stroke-opacity="0.10">
    <line x1="120" y1="700" x2="640" y2="700"/>
    <line x1="120" y1="740" x2="520" y2="740"/>
    <line x1="120" y1="780" x2="580" y2="780"/>
  </g>
  <g stroke="#ffffff" stroke-opacity="0.26">
    <path d="M 150 640 h 18 M 159 631 v 18"/>
  </g>
</svg>
