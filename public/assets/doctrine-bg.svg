<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" fill="none">
  <!-- Doctrine plate: monochrome command-grid motif. Rendered behind the
       No 04 quote at low opacity, so every stroke stays white-on-transparent. -->
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" stroke="#ffffff" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.72" cy="0.45" r="0.62">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#grid)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- Orbital rings, centred off-canvas right -->
  <g stroke="#ffffff">
    <circle cx="1160" cy="440" r="150" stroke-opacity="0.30"/>
    <circle cx="1160" cy="440" r="270" stroke-opacity="0.18"/>
    <circle cx="1160" cy="440" r="410" stroke-opacity="0.11"/>
    <circle cx="1160" cy="440" r="570" stroke-opacity="0.06"/>
  </g>

  <!-- Dashed sweep arcs -->
  <g stroke="#ffffff" stroke-opacity="0.34" stroke-dasharray="2 10">
    <path d="M 1160 105 A 335 335 0 0 1 1495 440"/>
    <path d="M 1160 775 A 335 335 0 0 1 825 440"/>
  </g>

  <!-- Radar ticks on the inner ring -->
  <g stroke="#ffffff" stroke-opacity="0.32">
    <line x1="1160" y1="278" x2="1160" y2="292"/>
    <line x1="1160" y1="278" x2="1160" y2="292" transform="rotate(30 1160 440)"/>
    <line x1="1160" y1="278" x2="1160" y2="292" transform="rotate(60 1160 440)"/>
    <line x1="1160" y1="278" x2="1160" y2="292" transform="rotate(90 1160 440)"/>
    <line x1="1160" y1="278" x2="1160" y2="292" transform="rotate(120 1160 440)"/>
    <line x1="1160" y1="278" x2="1160" y2="292" transform="rotate(150 1160 440)"/>
    <line x1="1160" y1="278" x2="1160" y2="292" transform="rotate(180 1160 440)"/>
    <line x1="1160" y1="278" x2="1160" y2="292" transform="rotate(210 1160 440)"/>
    <line x1="1160" y1="278" x2="1160" y2="292" transform="rotate(240 1160 440)"/>
    <line x1="1160" y1="278" x2="1160" y2="292" transform="rotate(270 1160 440)"/>
    <line x1="1160" y1="278" x2="1160" y2="292" transform="rotate(300 1160 440)"/>
    <line x1="1160" y1="278" x2="1160" y2="292" transform="rotate(330 1160 440)"/>
  </g>

  <!-- Node constellation, left field -->
  <g stroke="#ffffff" stroke-opacity="0.16">
    <polyline points="180,620 340,540 470,600 590,470 700,520"/>
    <polyline points="340,540 385,380 540,300 700,340"/>
    <polyline points="540,300 590,470"/>
  </g>
  <g fill="#ffffff" fill-opacity="0.5">
    <circle cx="180" cy="620" r="3"/>
    <circle cx="340" cy="540" r="3"/>
    <circle cx="470" cy="600" r="3"/>
    <circle cx="590" cy="470" r="3"/>
    <circle cx="700" cy="520" r="3"/>
    <circle cx="385" cy="380" r="3"/>
    <circle cx="540" cy="300" r="3"/>
    <circle cx="700" cy="340" r="3"/>
  </g>
  <g stroke="#ffffff" stroke-opacity="0.30">
    <circle cx="385" cy="380" r="9"/>
    <circle cx="590" cy="470" r="9"/>
  </g>

  <!-- Crosshair markers -->
  <g stroke="#ffffff" stroke-opacity="0.26">
    <path d="M 250 210 h 18 M 259 201 v 18"/>
    <path d="M 880 690 h 18 M 889 681 v 18"/>
    <path d="M 1380 170 h 18 M 1389 161 v 18"/>
    <path d="M 90 420 h 18 M 99 411 v 18"/>
  </g>

  <!-- Baseline scan rule -->
  <line x1="0" y1="760" x2="1600" y2="760" stroke="#ffffff" stroke-opacity="0.08"/>
  <g stroke="#ffffff" stroke-opacity="0.2">
    <line x1="240" y1="755" x2="240" y2="765"/>
    <line x1="800" y1="755" x2="800" y2="765"/>
    <line x1="1360" y1="755" x2="1360" y2="765"/>
  </g>
</svg>
